name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
          POSTGRES_DB: workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://workflow:workflow@localhost:5432/workflow
      NUXT_DATABASE_URL: postgres://workflow:workflow@localhost:5432/workflow
      NUXT_SESSION_PASSWORD: workflow-dev-session-password-32ch
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npx nuxi typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
